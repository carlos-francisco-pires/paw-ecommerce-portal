<div class="dashboard-container">
  <h1>O meu Dashboard</h1>

  <p *ngIf="carregando">A carregar...</p>

  <div class="cards-grid" *ngIf="!carregando">
    <mat-card class="stat-card">
      <mat-icon>receipt_long</mat-icon>
      <div>
        <span class="valor">{{ numEncomendas }}</span>
        <span class="label">Encomendas Feitas</span>
      </div>
    </mat-card>
  </div>

  <h2 *ngIf="!carregando">Produtos Mais Comprados</h2>

  <mat-card *ngIf="!carregando && produtosMaisComprados.length === 0">
    <mat-card-content>Ainda não fizeste nenhuma compra.</mat-card-content>
  </mat-card>

  <table
    mat-table
    [dataSource]="produtosMaisComprados"
    *ngIf="!carregando && produtosMaisComprados.length > 0"
    class="tabela-ranking"
  >
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Produto</th>
      <td mat-cell *matCellDef="let item">{{ item.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="totalComprado">
      <th mat-header-cell *matHeaderCellDef>Quantidade</th>
      <td mat-cell *matCellDef="let item">{{ item.totalComprado }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['nome', 'totalComprado']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['nome', 'totalComprado']"></tr>
  </table>
</div>
