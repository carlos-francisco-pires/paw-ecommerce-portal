<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Alterar Password</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password Atual</mat-label>
          <input matInput type="password" formControlName="passwordAtual" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nova Password</mat-label>
          <input matInput type="password" formControlName="novaPassword" />
        </mat-form-field>

        <p class="erro" *ngIf="erro">{{ erro }}</p>
        <p class="sucesso" *ngIf="sucesso">Password alterada com sucesso!</p>

        <button mat-raised-button color="primary" type="submit" class="full-width">
          Alterar Password
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
