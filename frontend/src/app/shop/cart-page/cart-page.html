<div class="cart-container">
  <h1>O meu Carrinho</h1>

  <p *ngIf="itens.length === 0">O teu carrinho está vazio.</p>

  <div *ngIf="itens.length > 0">
    <mat-card *ngFor="let item of itens" class="item-card">
      <mat-card-content class="item-content">
        <div class="item-info">
          <h3>{{ item.nome }}</h3>
          <p>{{ item.preco }} € / unidade</p>
        </div>

        <div class="item-quantidade">
          <button mat-icon-button (click)="diminuir(item)">
            <mat-icon>remove</mat-icon>
          </button>
          <span>{{ item.quantidade }}</span>
          <button mat-icon-button (click)="aumentar(item)">
            <mat-icon>add</mat-icon>
          </button>
        </div>

        <div class="item-subtotal">{{ item.preco * item.quantidade }} €</div>

        <button mat-icon-button color="warn" (click)="remover(item.produtoId)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-card-content>
    </mat-card>

    <div class="cart-total">
      <h2>Total: {{ getTotal() }} €</h2>
      <button mat-raised-button color="primary" routerLink="/checkout">Finalizar Compra</button>
    </div>
  </div>
</div>
