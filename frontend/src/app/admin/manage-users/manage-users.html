<div class="manage-container">
  <h1>Gerir Utilizadores</h1>

  <p *ngIf="carregando">A carregar...</p>

  <table mat-table [dataSource]="utilizadores" *ngIf="!carregando" class="tabela-utilizadores">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let utilizador">{{ utilizador.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let utilizador">{{ utilizador.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let utilizador">{{ utilizador.role }}</td>
    </ng-container>

    <ng-container matColumnDef="aprovado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let utilizador">
        <span *ngIf="utilizador.aprovado" class="estado-aprovado">Aprovado</span>
        <span *ngIf="!utilizador.aprovado" class="estado-pendente">Por aprovar</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let utilizador">
        <button
          mat-raised-button
          color="primary"
          *ngIf="utilizador.role === 'estafeta' && !utilizador.aprovado"
          (click)="aprovar(utilizador._id)"
        >
          Aprovar
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['nome', 'email', 'role', 'aprovado', 'acoes']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['nome', 'email', 'role', 'aprovado', 'acoes']"></tr>
  </table>
</div>
