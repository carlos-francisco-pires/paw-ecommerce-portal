<div class="manage-container">
  <h1>Gerir Métodos de Entrega</h1>

  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>{{
        metodoEmEdicao ? 'Editar Método' : 'Novo Método de Entrega'
      }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="metodoForm" (ngSubmit)="guardar()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tipo</mat-label>
          <mat-select formControlName="nome">
            <mat-option value="levantamento_loja">Levantamento na Loja</mat-option>
            <mat-option value="estafeta">Estafeta</mat-option>
            <mat-option value="transportadora">Transportadora</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Custo (€)</mat-label>
          <input matInput type="number" formControlName="custo" />
        </mat-form-field>

        <p class="erro" *ngIf="erro">{{ erro }}</p>

        <button mat-raised-button color="primary" type="submit">
          {{ metodoEmEdicao ? 'Guardar Alterações' : 'Criar Método' }}
        </button>

        <button mat-stroked-button type="button" (click)="cancelarEdicao()" *ngIf="metodoEmEdicao">
          Cancelar
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <h2>Métodos Existentes</h2>

  <p *ngIf="carregando">A carregar...</p>

  <table mat-table [dataSource]="metodos" *ngIf="!carregando" class="tabela-metodos">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let metodo">
        <span *ngIf="metodo.nome === 'levantamento_loja'">Levantamento na Loja</span>
        <span *ngIf="metodo.nome === 'estafeta'">Estafeta</span>
        <span *ngIf="metodo.nome === 'transportadora'">Transportadora</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="custo">
      <th mat-header-cell *matHeaderCellDef>Custo</th>
      <td mat-cell *matCellDef="let metodo">{{ metodo.custo }} €</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let metodo">
        <button mat-icon-button color="primary" (click)="editar(metodo)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="apagar(metodo._id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['nome', 'custo', 'acoes']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['nome', 'custo', 'acoes']"></tr>
  </table>
</div>
