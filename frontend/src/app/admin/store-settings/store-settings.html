<div class="manage-container">
  <h1>Configuração da Loja</h1>

  <p *ngIf="carregando">A carregar...</p>

  <mat-card class="form-card" *ngIf="!carregando">
    <mat-card-header>
      <mat-card-title>Dados da Loja</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="storeForm" (ngSubmit)="guardar()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome da Loja</mat-label>
          <input matInput formControlName="nome" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Horário de Funcionamento</mat-label>
          <input matInput formControlName="horarioFuncionamento" placeholder="Ex: 09:00 - 19:00" />
        </mat-form-field>

        <div class="logotipo-atual" *ngIf="logotipoAtual">
          <p>Logotipo atual:</p>
          <img [src]="'http://localhost:3000' + logotipoAtual" class="logotipo-preview" />
        </div>

        <div class="upload-linha">
          <label>
            {{ logotipoAtual ? 'Alterar logotipo:' : 'Escolher logotipo:' }}
          </label>

          <input type="file" accept="image/*" (change)="aoEscolherLogotipo($event)" />
        </div>

        <p class="erro" *ngIf="erro">{{ erro }}</p>
        <p class="sucesso" *ngIf="sucesso">Dados guardados com sucesso!</p>

        <button mat-raised-button color="primary" type="submit">Guardar</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
