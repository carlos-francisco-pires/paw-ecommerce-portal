<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Criar Conta</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome</mat-label>
          <input matInput type="text" formControlName="nome" />
          <mat-error *ngIf="registerForm.get('nome')?.hasError('required')">
            O nome é obrigatório
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
            O email é obrigatório
          </mat-error>
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
            Introduz um email válido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" />
          <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
            A password é obrigatória
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Morada</mat-label>
          <input matInput type="text" formControlName="morada" />
          <mat-error *ngIf="registerForm.get('morada')?.hasError('required')">
            A morada é obrigatória
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Telefone</mat-label>
          <input matInput type="text" formControlName="telefone" />
          <mat-error *ngIf="registerForm.get('telefone')?.hasError('required')">
            O telefone é obrigatório
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tipo de conta</mat-label>
          <mat-select formControlName="role">
            <mat-option value="cliente">Cliente</mat-option>
            <mat-option value="estafeta">Estafeta</mat-option>
          </mat-select>
        </mat-form-field>

        <p class="erro" *ngIf="erro">{{ erro }}</p>

        <button mat-raised-button color="primary" type="submit" class="full-width">Registar</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
